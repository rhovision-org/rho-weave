<g font-family="system-ui,Segoe UI,sans-serif">
<text x="35" y="40" fill="#83d9c6" font-size="13" font-weight="700" letter-spacing="2">RECORDED / WEAVE VALIDATION</text>
<g fill="#203344" stroke="#42586c"><rect x="35" y="63" width="327" height="125" rx="11"/><rect x="376" y="63" width="327" height="125" rx="11"/><rect x="717" y="63" width="328" height="125" rx="11"/></g>
<g fill="#83d9c6" font-size="42" font-weight="700"><text x="55" y="120">50 / 50</text><text x="396" y="120">300</text><text x="737" y="120">3 / 3</text></g>
<g fill="#edf3f8" font-size="17" font-weight="600"><text x="55" y="148">Rholo observations</text><text x="396" y="148">Randomized models</text><text x="737" y="148">Offline CI jobs passed</text></g>
<g fill="#b6c7d9" font-size="13"><text x="55" y="169">10 closed-fragment fixtures</text><text x="396" y="169">Reference solver comparison</text><text x="737" y="169">Python 3.10, 3.12, 3.13</text></g>
<text x="35" y="219" fill="#b6c7d9" font-size="13">Sampled runtime agreement, not a formal proof of equivalence.</text>
