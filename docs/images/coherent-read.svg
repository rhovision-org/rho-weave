<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc"><title id="title">Two reads, one consistent snapshot</title><desc id="desc">Independent latest reads can mix block A and B. The synthesized strategy pins a finalized block, then reads both values at that anchor.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#83d9c6"/></marker></defs>
<rect x="1" y="1" width="1078" height="478" rx="20" fill="#142333" stroke="#394e62"/><g font-family="system-ui,Segoe UI,sans-serif">
<text x="40" y="49" fill="#83d9c6" font-size="14" font-weight="700" text-anchor="start">EXAMPLE / COHERENT READS</text>
<text x="40" y="88" fill="#eef4fa" font-size="30" font-weight="700" text-anchor="start">Two reads. One consistent snapshot.</text>
<text x="40" y="118" fill="#b6c7d9" font-size="16" font-weight="400" text-anchor="start">A chain can advance between independent requests.</text>
<text x="40" y="160" fill="#f2b49e" font-size="13" font-weight="700" text-anchor="start">WITHOUT AN ANCHOR</text>
<rect x="40" y="180" width="240" height="77" rx="12" fill="#203344" stroke="#42586c"/>
<text x="160" y="210" fill="#eef4fa" font-size="17" font-weight="600" text-anchor="middle">Read membership</text>
<text x="160" y="235" fill="#b6c7d9" font-size="14" font-weight="400" text-anchor="middle">Block A</text>
<rect x="420" y="180" width="240" height="77" rx="12" fill="#203344" stroke="#42586c"/>
<text x="540" y="210" fill="#eef4fa" font-size="17" font-weight="600" text-anchor="middle">Chain advances</text>
<text x="540" y="235" fill="#b6c7d9" font-size="14" font-weight="400" text-anchor="middle">A → B</text>
<rect x="800" y="180" width="240" height="77" rx="12" fill="#203344" stroke="#42586c"/>
<text x="920" y="210" fill="#eef4fa" font-size="17" font-weight="600" text-anchor="middle">Read tally</text>
<text x="920" y="235" fill="#b6c7d9" font-size="14" font-weight="400" text-anchor="middle">Block B</text>
<path d="M289 218L410 218" fill="none" stroke="#83d9c6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M669 218L790 218" fill="none" stroke="#83d9c6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="283" fill="#f2b49e" font-size="15" font-weight="400" text-anchor="start">The pair may not describe any single block.</text>
<text x="40" y="327" fill="#83d9c6" font-size="13" font-weight="700" text-anchor="start">SYNTHESIZED POLICY</text>
<rect x="40" y="346" width="240" height="77" rx="12" fill="#203b40" stroke="#83d9c6"/>
<text x="160" y="375" fill="#eef4fa" font-size="17" font-weight="600" text-anchor="middle">Pin finalized block</text>
<text x="160" y="400" fill="#b6c7d9" font-size="14" font-weight="400" text-anchor="middle">Anchor A</text>
<rect x="420" y="346" width="240" height="77" rx="12" fill="#203b40" stroke="#83d9c6"/>
<text x="540" y="375" fill="#eef4fa" font-size="17" font-weight="600" text-anchor="middle">Read at anchor</text>
<text x="540" y="400" fill="#b6c7d9" font-size="14" font-weight="400" text-anchor="middle">Both requests use A</text>
<rect x="800" y="346" width="240" height="77" rx="12" fill="#203b40" stroke="#83d9c6"/>
<text x="920" y="375" fill="#eef4fa" font-size="17" font-weight="600" text-anchor="middle">Coherent result</text>
<text x="920" y="400" fill="#b6c7d9" font-size="14" font-weight="400" text-anchor="middle">Same block A</text>
<path d="M289 385L410 385" fill="none" stroke="#83d9c6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M669 385L790 385" fill="none" stroke="#83d9c6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="456" fill="#b6c7d9" font-size="14" font-weight="400" text-anchor="start">The model assumes a trusted, available by-hash read. No fallback to a different block.</text>
</g></svg>
