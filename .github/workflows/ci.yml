name: Offline policy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m rhoweave examples/quantum-os.json --output cert.json --export policy.json
      - run: python -m rhoweave examples/quantum-os.json --verify cert.json
      - run: node runtime/test.mjs policy.json
      - run: python -m rhoweave.rholang examples/coherent-read.rho --input pin --input read --input unsafe_read --goal coherent --forbid mixed --output compiled.json
      - run: python -m rhoweave compiled.json
      - run: python -m rhoweave examples/rhogov.json --export gov-policy.json
      - run: node runtime/test-adapters.mjs gov-policy.json policy.json
      - run: python tools/build_zipapp.py rho-weave.pyz
      - run: python rho-weave.pyz examples/rhogov.json
      - name: Verify pinned upstream source and extract recovery table
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/rhovision-org/quantum-os/4d3e73b1f7d5ffe0c98b1b1c65a17c9937589948/packages/browser/src/exchange-2pc.ts -o qos-pinned.ts
          echo '5eed654a8912fc28058749b7c544eaa85ba95c243b95b9ccd8539770d543b80a  qos-pinned.ts' | sha256sum -c
          python rho-weave.pyz audit qos-pinned.ts examples/quantum-os.json > qos-audit.json
          diff -u evidence/quantum-os-source-audit.json qos-audit.json
