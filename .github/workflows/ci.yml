name: Offline policy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m rhoweave examples/quantum-os.json --output cert.json --export policy.json
      - run: python -m rhoweave examples/quantum-os.json --verify cert.json
      - run: node runtime/test.mjs policy.json
      - run: python -m rhoweave.rholang examples/coherent-read.rho --input pin --input read --input unsafe_read --goal coherent --forbid mixed --output compiled.json
      - run: python -m rhoweave compiled.json
      - run: python -m rhoweave examples/rhogov.json --export gov-policy.json
      - run: node runtime/test-adapters.mjs gov-policy.json policy.json
      - run: python tools/build_zipapp.py rho-weave.pyz
      - run: python rho-weave.pyz examples/rhogov.json
      - name: Verify pinned upstream source and extract recovery table
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/rhovision-org/quantum-os/4d3e73b1f7d5ffe0c98b1b1c65a17c9937589948/packages/browser/src/exchange-2pc.ts -o qos-pinned.ts
          echo '5eed654a8912fc28058749b7c544eaa85ba95c243b95b9ccd8539770d543b80a  qos-pinned.ts' | sha256sum -c
          python rho-weave.pyz audit qos-pinned.ts examples/quantum-os.json > qos-audit.json
          diff -u evidence/quantum-os-source-audit.json qos-audit.json
  native-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rhovision-org/rho-forge
          ref: 7b06bd2d0d46933627e533e22d605ccf2b839397
          path: .integration/forge
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rhovision-org/rho-foundry
          ref: ed61d48b239e3f30320cfc1490a85f525220bbf3
          path: .integration/foundry
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rhovision-org/rho-observer
          ref: 6f90588d87e143f104acc47746bee1ac7a63d4ea
          path: .integration/observer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .integration/observer
      - name: Build the pinned Observer
        run: cargo build --locked --manifest-path .integration/observer/Cargo.toml
      - name: Fetch and verify pinned public Rholo binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .integration/rholo
          gh api repos/rhovision-org/rholo/actions/artifacts/14977847392/zip > .integration/rholo.zip
          echo 'f2ecced8a2b085183654828e1061f67469b95e225f1ae8ce022ea8fd9a5167e1  .integration/rholo.zip' | sha256sum -c
          unzip -q .integration/rholo.zip -d .integration/rholo
          chmod 700 .integration/rholo/rnode
      - name: Generate and execute reservation recovery
        run: |
          PYTHONPATH=. python tools/demo_recovery.py \
            --forge .integration/forge --foundry .integration/foundry \
            --observer .integration/observer/target/debug/rchain-observer \
            --rholo .integration/rholo/rnode --out recovery-native.json
      - uses: actions/upload-artifact@v4
        with:
          name: rho-reservation-recovery-native
          path: recovery-native.json
          if-no-files-found: error
