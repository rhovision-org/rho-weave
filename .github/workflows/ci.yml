name: Offline policy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m rhoweave examples/quantum-os.json --output cert.json --export policy.json
      - run: python -m rhoweave examples/quantum-os.json --verify cert.json
      - run: node runtime/test.mjs policy.json
